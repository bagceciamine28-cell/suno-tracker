name: Deploy Suno Follow Compare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarlarını yap
        uses: actions/configure-pages@v5

      - name: Siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
